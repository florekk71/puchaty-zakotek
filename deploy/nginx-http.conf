server {
    listen 80;
    listen [::]:80;
    server_name zakatek.topkomp.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Puchaty Zakatek: trwa konfiguracja HTTPS.\n";
    }
}
