server {
    listen 80;
    listen [::]:80;
    server_name zakatek.topkomp.pl;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://zakatek.topkomp.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zakatek.topkomp.pl;

    ssl_certificate /etc/letsencrypt/live/zakatek.topkomp.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zakatek.topkomp.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 50m;

    location = / {
        return 302 /custom/puchatyzakatek/portal/;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
