; PUCHATY ZAKATEK - KONFIGURACJA POCZTY
; Skopiuj ten plik jako mail-config.ini do katalogu C:\PuchatyZakatek.
; Nie umieszczaj wypelnionego pliku w katalogu custom ani na GitHubie.
; Wartosci tekstowe wpisuj w cudzyslowach. Kodowanie pliku: UTF-8.
; Uruchom deploy/install-mail.ps1, aby podlaczyc konfiguracje i harmonogram.

[smtp]
; Dane otrzymasz od dostawcy swojej skrzynki pocztowej.
host = ""
; Najczesciej: 587 z starttls lub 465 z tls (wedlug dostawcy).
port = 587
encryption = "starttls"
username = ""
; Jesli dostawca tego wymaga, wpisz haslo aplikacji, nie haslo logowania.
password = ""
timeout_seconds = 20
verify_certificate = true

[sender]
address = "biuro@puchaty-zakatek.pl"
name = "Puchaty Zakątek"
; Opcjonalnie inny adres do odpowiedzi. Puste = adres nadawcy.
reply_to = "biuro@puchaty-zakatek.pl"

[delivery]
; Wlacz po poprawnym tescie SMTP.
enabled = false
; Adres salonu do wiadomosci testowej.
test_recipient = "biuro@puchaty-zakatek.pl"

[messages]
booking_confirmation = false
appointment_changed = false
appointment_cancelled = false
appointment_reminder = false
invoice_after_payment = false

[reminders]
hours_before = 24
timezone = "Europe/Warsaw"

[salon]
phone = ""
; Adres miejsca wizyty widoczny w potwierdzeniu.
address = ""
footer = "Do zobaczenia w Puchatym Zakątku!"
