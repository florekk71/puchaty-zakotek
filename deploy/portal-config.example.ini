; Skopiuj do portal-config.ini w katalogu projektu (poza custom/).
; Plik rzeczywisty jest ignorowany przez Git. Nie wpisuj sekretów do tego wzoru.
[portal]
enabled = false
; Pełny adres, bez końcowego ukośnika, np. https://salon.example/custom/puchatyzakatek/portal
base_url = ""
; Wygeneruj: php -r "echo bin2hex(random_bytes(32)), PHP_EOL;"
app_secret = ""
; Istniejący aktywny pracownik z prawem zapisu PZ; autor nowych kartotek klientów.
service_user_login = ""
; Link do własnej informacji o przetwarzaniu danych klientów.
privacy_url = ""
; Wyłącznie do lokalnych testów na localhost (nie na serwerze publicznym).
allow_local_http = false

[auth]
email_enabled = true
google_enabled = false
google_client_id = ""
google_client_secret = ""
; Google OAuth Web application: redirect URI = base_url + /google.php
; E-mail: jednorazowy kod, ważny 10 minut. Hasła klientów nie są potrzebne.

[calendar]
; Zasady stałe: 180 minut na psa, maksymalnie 3 psy/dzień, co najmniej 60 min wyprzedzenia.
; Wszystkie daty są w Europe/Warsaw. Uzupełnij godziny, zanim włączysz portal.
; Po wpisaniu godzin ustaw true. Wyłączony wzór nie blokuje terminarza pracowników.
enforce_hours = false
days_ahead = 90
; Zamknięty dzień = pusty tekst. Otwarty = HH:MM-HH:MM (np. 09:00-18:00).
monday = ""
tuesday = ""
wednesday = ""
thursday = ""
friday = ""
saturday = ""
sunday = ""
; Dni wolne, rozdzielone przecinkami, np. 2026-12-24,2026-12-25.
closed_dates = ""
